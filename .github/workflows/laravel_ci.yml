name: Laravel CI

on:
  push:
    branches: [main]
    paths:
      - 'laravel-web/**'
      - '.github/workflows/laravel_ci.yml'
  pull_request:
    paths:
      - 'laravel-web/**'
      - '.github/workflows/laravel_ci.yml'

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel feature tests
        run: php artisan test --colors=always

      - name: Check PHP formatting
        run: vendor/bin/pint --test
